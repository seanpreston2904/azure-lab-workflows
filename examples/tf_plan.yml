name: Terraform Plan

on:
    pull_request:
        branches: [master]

permissions:
    id-token: write
    contents: read
    pull-requests: write

jobs:
    plan:
        uses: seanpreston2904/azure-lab-workflows/.github/workflows/tf_plan.yml@v1
        with:
            state_resource_group: rg-tf-state-aue
            state_storage_account: stspdevtfstate
            state_container: sub-management
            state_key_strip_prefix: terraform/solutions/
        secrets: inherit
